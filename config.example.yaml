# Warframe Bot 配置示例 — 复制为 config.yaml 后修改

prefix:
  - "wf "
  - "/"

# 日志级别: fatal | error | warn | info | debug | trace
logLevel: info

# 世界状态 / API
# - 腾讯云等国内 VPS 推荐 source: de（直连 DE CDN，无需 warframe-status）
# - 旧 content.warframe.com/dynamic/worldState.php 已全局 404，勿再用
# - api.warframestat.us 在国内常被 Cloudflare 403；自建 status 可选但非必需
api:
  # source: de | warframestat | mock
  source: de
  deWorldStateUrl: "https://api.warframe.com/cdn/worldState.php"
  # 仅 source=warframestat 时使用（官方或自建）：
  # baseUrl: "https://api.warframestat.us"
  # baseUrl: "http://warframe-status:3001"  # compose 同网络（可选）
  # baseUrl: "http://host.docker.internal:3001"  # status 用 WARP 侧车时
  baseUrl: "https://api.warframestat.us"
  fallbackBaseUrls: []   # e.g. ["https://api.warframestat.us"]
  # proxy via env HTTPS_PROXY preferred（DE / warframestat 共用）
  # proxyUrl: "http://127.0.0.1:7890"
  # userAgent: "warframe-bot/1.1 (+https://github.com/camilavivan/warframe-bot)"
  platform: "pc"          # pc | ps4 | xb1 | swi
  language: "zh"
  cacheTtlMs: 60000       # 世界状态缓存 TTL（DE / 命令共用 globalCache）
  # 模拟模式：不访问外网 API；也可用 WARFRAMESTAT_MOCK=1
  # 环境变量 WARFRAMESTAT_SOURCE=de|warframestat|mock
  mock: false
  mockFixturePath: ./fixtures/worldstate-pc-zh.json  # relative to cwd

# 推送
push:
  enabled: true
  intervalMs: 60000       # 轮询间隔 60s
  sqlitePath: "./data/bot.db"

# 健康检查 HTTP（Docker HEALTHCHECK 默认打 :6700/health）
# - OneBot 启用且端口相同：复用 OneBot 的 /health
# - OneBot 关闭或端口不同：单独启动轻量 health 服务
health:
  host: "0.0.0.0"
  port: 6700

# OneBot v11（NapCat / go-cqhttp / Lagrange）
onebot:
  enabled: true
  # 接收事件的 HTTP 服务
  host: "0.0.0.0"
  port: 6700
  accessToken: ""         # 可选，与反向 HTTP 上报的 token 一致
  # 发送消息的 OneBot HTTP API
  # Docker → 宿主机 OneBot：http://host.docker.internal:5700
  # Docker → 同 compose 网络：http://napcat:5700
  apiBase: "http://127.0.0.1:5700"
  apiAccessToken: ""      # 可选，API 鉴权 token

# KOOK 官方 Bot
kook:
  enabled: false
  token: ""               # Bot Token（来自开发者后台）；也可用环境变量 KOOK_TOKEN
  # compress: true        # 网关是否压缩（默认 true）

# QQ 官方开放平台机器人（AppID + AppSecret，非 OneBot / 非 WorkBuddy）
# 文档：https://bot.q.qq.com/wiki/  ·  SDK：qq-official-bot
# 注意：https://q.qq.com/setup/ 上的 WorkBuddy 是第三方 Agent 客户端，不是本适配器
qqofficial:
  enabled: false
  appId: ""               # 或环境变量 QQ_BOT_APP_ID
  secret: ""              # 或环境变量 QQ_BOT_SECRET
  sandbox: true           # 首次建议 true（沙箱群验证）
  removeAt: true          # 分发前去掉 @机器人
  # mode: websocket       # websocket（默认）| webhook
  # webhookPort: 9000
  # webhookPath: /qqbot/webhook

