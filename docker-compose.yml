services:
  # 自建 WFCD warframe-status（绕过国内对 api.warframestat.us 的 Cloudflare 403）
  # bot 的 config.yaml 必须设：
  #   api:
  #     baseUrl: "http://warframe-status:3001"
  #     mock: false
  # 若 DE 内容服对机房 IP 地理封锁，改用：
  #   docker compose -f docker-compose.with-status-warp.yml up -d --build
  warframe-status:
    image: ghcr.io/wfcd/warframe-status:latest
    container_name: warframe-status
    restart: unless-stopped
    ports:
      - "3001:3001" # 可选：宿主机 curl 调试
    volumes:
      - ./ws-caches:/app/caches
    environment:
      - LOG_LEVEL=error
      - HOSTNAME=0.0.0.0
      - PORT=3001
    # 镜像为 alpine node，无 curl；用内置 node fetch 探活（官方文档用 /heartbeat）
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  warframe-bot:
    build: .
    image: warframe-bot:latest
    container_name: warframe-bot
    restart: unless-stopped
    depends_on:
      warframe-status:
        condition: service_started
    ports:
      - "6700:6700"
    # 不要加 user:；入口以 root 启动后 chown ./data 再降权为 node
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    # 兼容旧版 docker-compose：不要用 path/required 对象写法。
    # 若已有 .env，取消下一行注释即可（没有 .env 时请保持注释，否则旧版会报错）：
    # env_file:
    #   - .env
    environment:
      - LOG_LEVEL=info
      # - KOOK_TOKEN=
      # - ONEBOT_ACCESS_TOKEN=
      # - ONEBOT_API_ACCESS_TOKEN=
      # - HTTPS_PROXY=http://host.docker.internal:7890
      # 模拟模式（无外网 / CF 403）：也可在 config.yaml 设 api.mock: true
      # - WARFRAMESTAT_MOCK=1
      # - WARFRAMESTAT_MOCK_FIXTURE=/app/fixtures/worldstate-pc-zh.json
    # 访问宿主机上的 OneBot HTTP API（config 中 apiBase: http://host.docker.internal:5700）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.50"
    #       memory: 256M

  # --- 可选：同 compose 网络内的 NapCat / OneBot ---
  # napcat:
  #   image: mlikiowa/napcat-docker:latest
  #   container_name: napcat
  #   restart: unless-stopped
  #   ports:
  #     - "5700:5700"   # OneBot HTTP API
  #   # 将上报 URL 设为 http://warframe-bot:6700/
  #   # 同时把 warframe-bot 的 onebot.apiBase 改为 http://napcat:5700
