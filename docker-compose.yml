services:
  warframe-bot:
    build: .
    image: warframe-bot:latest
    container_name: warframe-bot
    restart: unless-stopped
    ports:
      - "6700:6700"
    # 不要加 user:；入口以 root 启动后 chown ./data 再降权为 node
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    # 兼容旧版 docker-compose：不要用 path/required 对象写法。
    # 若已有 .env，取消下一行注释即可（没有 .env 时请保持注释，否则旧版会报错）：
    # env_file:
    #   - .env
    environment:
      - LOG_LEVEL=info
      # - KOOK_TOKEN=
      # - ONEBOT_ACCESS_TOKEN=
      # - ONEBOT_API_ACCESS_TOKEN=
      # - HTTPS_PROXY=http://host.docker.internal:7890
    # 访问宿主机上的 OneBot HTTP API（config 中 apiBase: http://host.docker.internal:5700）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.50"
    #       memory: 256M

  # --- 可选：同 compose 网络内的 NapCat / OneBot ---
