services:
  warframe-bot:
    build: .
    container_name: warframe-bot
    restart: unless-stopped
    ports:
      - "6700:6700"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      - LOG_LEVEL=info
      # - KOOK_TOKEN=
      # - ONEBOT_ACCESS_TOKEN=
    # 若 OneBot HTTP API 在宿主机，可用 host 网络或改 apiBase 为 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
