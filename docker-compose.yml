services:
  # 自建 WFCD warframe-status（绕过国内对 api.warframestat.us 的 Cloudflare 403）
  # bot 的 config.yaml 必须设：
  #   api:
  #     baseUrl: "http://warframe-status:3001"
  #     mock: false
  # 若 DE 内容服对机房 IP 地理封锁，改用：
  #   docker compose -f docker-compose.with-status-warp.yml up -d --build
  warframe-status:
    image: ghcr.io/wfcd/warframe-status:latest
    container_name: warframe-status
    restart: unless-stopped
    ports:
      - "3001:3001" # 可选：宿主机 curl 调试
    volumes:
      - ./ws-caches:/app/caches
    environment:
      - LOG_LEVEL=info
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - USE_WORLDSTATE=true
      - FEATURES=worldstate
      - BUILD=build
