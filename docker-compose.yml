services:
  # 自建 WFCD warframe-status（绕过国内对 api.warframestat.us 的 Cloudflare 403）
  # bot 的 config.yaml 必须设：
  #   api:
  #     baseUrl: "http://warframe-status:3001"
  #     mock: false
  warframe-status:
    image: ghcr.io/wfcd/warframe-status:latest
    container_name: warframe-status
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./ws-caches:/app/caches
    environment:
      - LOG_LEVEL=info
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - USE_WORLDSTATE=true
      - FEATURES=worldstate
      - BUILD=build
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  warframe-bot:
    build: .
    image: warframe-bot:latest
    container_name: warframe-bot
    restart: unless-stopped
    depends_on:
      - warframe-status
    ports:
      - "6700:6700"
    # 不要加 user:；入口以 root 启动后 chown ./data 再降权为 node
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    # 宿主机 .env（勿提交）。旧版 compose 用字符串形式；没有文件时需自行 touch .env
    env_file:
      - .env
    environment:
      - LOG_LEVEL=info
      # QQ 凭证只走 env_file:.env（勿在此写空默认值，会覆盖掉密钥）
      # - WARFRAMESTAT_MOCK=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
