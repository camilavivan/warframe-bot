  #   image: mlikiowa/napcat-docker:latest
  #   container_name: napcat
  #   restart: unless-stopped
  #   ports:
  #     - "5700:5700"   # OneBot HTTP API
  #   # 将上报 URL 设为 http://warframe-bot:6700/
  #   # 同时把 warframe-bot 的 onebot.apiBase 改为 http://napcat:5700
