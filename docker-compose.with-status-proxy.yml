# 无 WARP / 无 TUN 时：用你已有的 HTTP(S) 代理让 warframe-status 出网拉官方 worldState
# （比 Cloudflare WARP 容器更稳，适合腾讯云等禁 TUN 环境）
#
# 用法：
#   export WARFRAME_STATUS_PROXY=http://127.0.0.1:7890   # 宿主机上的 clash/v2ray HTTP 端口
#   # config.yaml:
#   #   api:
#   #     baseUrl: "http://warframe-status:3001"
#   #     mock: false
#   mkdir -p ws-caches data
#   docker-compose -f docker-compose.with-status-proxy.yml up -d --build
#
# 注意：代理要能访问 content.warframe.com / 官方 worldState；仅科学上网节点即可。

services:
  warframe-status:
    image: ghcr.io/wfcd/warframe-status:latest
    container_name: warframe-status
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./ws-caches:/app/caches
    environment:
      - LOG_LEVEL=info
      - HOSTNAME=0.0.0.0
      - PORT=3001
      # 容器访问宿主机代理
      - HTTP_PROXY=${WARFRAME_STATUS_PROXY:-http://host.docker.internal:7890}
      - HTTPS_PROXY=${WARFRAME_STATUS_PROXY:-http://host.docker.internal:7890}
      - NO_PROXY=localhost,127.0.0.1,warframe-bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  warframe-bot:
    build: .
    image: warframe-bot:latest
    container_name: warframe-bot
    restart: unless-stopped
    depends_on:
      - warframe-status
    ports:
      - "6700:6700"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
