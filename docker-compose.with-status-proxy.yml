# 用 HTTP 代理让 status 拉官方 worldState
# export WARFRAME_STATUS_PROXY=http://host.docker.internal:7890
# config.yaml: api.baseUrl http://warframe-status:3001 , mock: false

services:
  warframe-status:
    image: ghcr.io/wfcd/warframe-status:latest
    container_name: warframe-status
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./ws-caches:/app/caches
    environment:
      - LOG_LEVEL=info
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - USE_WORLDSTATE=true
      - FEATURES=worldstate
      - BUILD=build
      - HTTP_PROXY=${WARFRAME_STATUS_PROXY:-http://host.docker.internal:7890}
      - HTTPS_PROXY=${WARFRAME_STATUS_PROXY:-http://host.docker.internal:7890}
      - NO_PROXY=localhost,127.0.0.1,warframe-bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  warframe-bot:
    build: .
    image: warframe-bot:latest
    container_name: warframe-bot
    restart: unless-stopped
    depends_on:
      - warframe-status
    ports:
      - "6700:6700"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
