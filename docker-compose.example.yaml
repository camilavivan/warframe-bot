# 完整示例：warframe-bot + 注释掉的 NapCat 同网部署
# 用法：cp docker-compose.example.yaml docker-compose.yml 后按需编辑

services:
  warframe-bot:
    build: .
    image: warframe-bot:latest
    container_name: warframe-bot
    restart: unless-stopped
    ports:
      - "6700:6700"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: info
      # KOOK_TOKEN: ${KOOK_TOKEN:-}
      # ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 若 OneBot 在同 compose 网络，取消下面 depends_on，并把 config 中
    # onebot.apiBase 设为 http://napcat:5700
    # depends_on:
    #   - napcat

