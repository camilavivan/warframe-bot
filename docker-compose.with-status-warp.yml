# WARP 方案（腾讯云上常失败，优先用普通 compose 或 proxy）
# config.yaml: api.baseUrl http://host.docker.internal:3001 , mock: false

services:
  warp:
    image: caomingjun/warp@sha256:905b91c3fe197a625611064ef0664f27e9ecdd0a30a91c4ae7046e06a2bf2643
    container_name: warframe-warp
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
      - SYS_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=2
      - BETA_FIX_HOST_CONNECTIVITY=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    ports:
      - "3001:3001"

  warframe-status:
    image: ghcr.io/wfcd/warframe-status:latest
    container_name: warframe-status
    restart: unless-stopped
    network_mode: service:warp
    depends_on:
      - warp
    environment:
      - LOG_LEVEL=info
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - USE_WORLDSTATE=true
      - FEATURES=worldstate
      - BUILD=build
    volumes:
      - ./ws-caches:/app/caches

  warframe-bot:
    build: .
    image: warframe-bot:latest
    container_name: warframe-bot
    restart: unless-stopped
    depends_on:
      - warframe-status
    ports:
      - "6700:6700"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  warp-data:
